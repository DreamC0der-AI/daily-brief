name: daily
on:
  schedule:
    - cron: "30 22 * * *"   # 06:30 Asia/Tokyo daily (UTC 22:30 previous day)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect candidates (scheduled and manual runs only)
        if: github.event_name != 'push'
        env:
          TZ: Asia/Tokyo
        run: |
          python collect.py
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/candidates
          git commit -m "collect: $(TZ=Asia/Tokyo date +%F)" || echo "nothing to commit"
          git push
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
