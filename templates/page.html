<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Brief · {{DATE}}</title>
<style>
:root{--bg:#f6f4ee;--fg:#1b1a17;--muted:#6b6760;--line:#dcd8cd;--card:#fffdf8;--accent:#b4451f;
  --ai:#4a5fc1;--tech:#1f7a6a;--crypto:#c48a12;--bio:#a4385c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15140f;--fg:#ebe7dc;--muted:#a19c90;--line:#33312a;--card:#1e1d17;--accent:#e0704a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif}
a{color:inherit}
[data-lang=en] [lang=zh],[data-lang=zh] [lang=en]{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-weight:700;font-size:20px;letter-spacing:.02em;text-decoration:none}
.brand em{color:var(--accent);font-style:normal}
nav{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:14px}
nav a{color:var(--muted);text-decoration:none}
.lang{border:1px solid var(--line);border-radius:999px;display:inline-flex;overflow:hidden}
.lang button{border:0;background:none;color:var(--muted);padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--fg);color:var(--bg)}
main{max-width:920px;margin:0 auto;padding:28px 16px 60px}
.date{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(28px,5vw,40px);margin:0 0 6px;line-height:1.15}
.sub{color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid}
.badge.ok{color:#2b7a3d;border-color:#2b7a3d}.badge.auto{color:var(--muted)}
.badge-sm{font-size:11px;color:#2b7a3d;margin-left:6px}
.intro{margin:18px 0 6px;font-size:17px;max-width:70ch}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
.topics a{text-decoration:none;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
section{margin-top:34px}
.topic{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:22px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--fg);display:flex;align-items:baseline;gap:10px}
.topic small{color:var(--muted);font:13px sans-serif}
.long{padding:26px 0 30px;border-bottom:1px solid var(--line)}
.hero{display:block;max-height:420px;overflow:hidden;border-radius:10px;background:var(--line);margin-bottom:14px}
.hero img{width:100%;height:100%;max-height:420px;object-fit:cover;display:block}
.long h2{font-size:26px;line-height:1.25;margin:4px 0 12px}
.long .body p{margin:0 0 12px;font-size:17px;line-height:1.65;max-width:72ch}
.more{margin:6px 0 0;font-size:14px}.more a{color:var(--accent);text-decoration:none}
.shorts{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.short{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.short:not(:has(.thumb)){grid-template-columns:1fr}
.short h3{font-size:17px;line-height:1.3;margin:0 0 6px;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}
.short h3 a{text-decoration:none}.short h3 a:hover{color:var(--accent)}
.short .sum{font-size:14.5px;line-height:1.5;color:var(--muted)}
.thumb{display:block;aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.num{font-family:Georgia,serif;font-size:13px}
.tag{font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.tag.ai{color:var(--ai)}.tag.tech{color:var(--tech)}.tag.crypto{color:var(--crypto)}.tag.bio{color:var(--bio)}
h2{font-size:19px;line-height:1.3;margin:0 0 8px;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}
h2 a{text-decoration:none}h2 a:hover{color:var(--accent)}
.sum{margin:0;color:var(--fg);opacity:.9}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.pager{display:flex;justify-content:space-between;margin-top:40px;font-size:14px}
.pager a{color:var(--muted);text-decoration:none}
.archive{list-style:none;padding:0;margin:20px 0}.archive li{padding:8px 0;border-bottom:1px solid var(--line)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media (max-width:760px){.shorts{grid-template-columns:1fr}.long h2{font-size:22px}.long .body p{font-size:16px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="index.html">Daily<em>Brief</em></a>
  <nav><a href="archive.html"><span lang="en">Archive</span><span lang="zh">往期</span></a>
  <span class="lang"><button data-set="en">EN</button><button data-set="zh">中文</button></span></nav>
</div></header>
<main>
  <h1 class="date"><span lang="en">{{DATE_LONG_EN}}</span><span lang="zh">{{DATE_LONG_ZH}}</span></h1>
  <div class="sub">{{BADGE}}<span>{{COUNT}} <span lang="en">items</span><span lang="zh">条</span></span></div>
  <p class="intro"><span lang="en">{{INTRO_EN}}</span><span lang="zh">{{INTRO_ZH}}</span></p>
  <div class="topics"><a href="#depth"><span lang="en">In depth</span><span lang="zh">深度</span></a><a href="#briefs"><span lang="en">Briefs</span><span lang="zh">简讯</span></a></div>
  {{SECTIONS}}
  <div class="pager">{{PREV}}{{NEXT}}</div>
</main>
<footer>Built from public RSS feeds. Summaries written by Claude Code.</footer>
<script>
(function(){var r=document.documentElement,k='dailybrief-lang';
function set(l){r.setAttribute('data-lang',l);r.lang=l==='zh'?'zh-CN':'en';try{localStorage.setItem(k,l)}catch(e){}
 document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.set===l)})}
var s=null;try{s=localStorage.getItem(k)}catch(e){}
set(s||((navigator.language||'').startsWith('zh')?'zh':'en'));
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){set(b.dataset.set)}})})();
</script>
</body>
</html>
